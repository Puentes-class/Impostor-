<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descubre al Impostor - Desafío Galáctico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0d19;
      --card-bg: rgba(22, 27, 51, 0.85);
      --card-border: rgba(99, 102, 241, 0.3);
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-purple: #8b5cf6;
      --accent-yellow: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --correct-color: #10b981;
      --wrong-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    canvas#starsCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .game-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.3rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
      letter-spacing: 1px;
    }

    .stats-bar {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-badge span {
      color: var(--accent-cyan);
    }

    .progress-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      margin-top: 15px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width 0.4s ease;
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .question-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 25px;
    }

    .category-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid var(--accent-purple);
      border-radius: 12px;
      font-size: 0.85rem;
      color: #c084fc;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .question-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.5rem;
      color: #fff;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .cards-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--accent-cyan);
      box-shadow: 0 12px 25px rgba(6, 182, 212, 0.25);
    }

    .card-svg-wrapper {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 10px;
    }

    .card-svg-wrapper svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      color: #e5e7eb;
    }

    .card.correct {
      border-color: var(--correct-color) !important;
      background: rgba(16, 185, 129, 0.2) !important;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.4) !important;
      animation: pulse-correct 0.6s ease;
    }

    .card.wrong {
      border-color: var(--wrong-color) !important;
      background: rgba(239, 68, 68, 0.2) !important;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.4) !important;
      animation: shake 0.4s ease;
    }

    .card.disabled {
      pointer-events: none;
      opacity: 0.6;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    @keyframes pulse-correct {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .explanation-modal {
      margin-top: 25px;
      width: 100%;
      background: rgba(17, 24, 39, 0.95);
      border: 2px solid var(--accent-purple);
      border-radius: 16px;
      padding: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .explanation-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.3rem;
      color: var(--accent-yellow);
      margin-bottom: 8px;
    }

    .explanation-text {
      font-size: 1rem;
      line-height: 1.5;
      color: #d1d5db;
      margin-bottom: 15px;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      color: #fff;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      padding: 12px 30px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }

    .btn-next:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
    }

    /* Modal Fin de Juego */
    .end-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .end-card {
      background: var(--card-bg);
      border: 2px solid var(--accent-cyan);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.3);
    }

    .end-card h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      color: var(--accent-yellow);
      margin-bottom: 15px;
    }

    .end-card p {
      font-size: 1.1rem;
      color: #e5e7eb;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .score-summary {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="starsCanvas"></canvas>

  <div class="game-container">
    <header>
      <h1>🕵️ DESCUBRE AL IMPOSTOR</h1>
      <div class="stats-bar">
        <div class="stat-badge">Nivel: <span id="levelText">1 / 15</span></div>
        <div class="stat-badge">Puntos: <span id="scoreText">0</span></div>
        <div class="stat-badge">Racha: <span id="streakText">🔥 0</span></div>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </header>

    <main style="width: 100%;">
      <div class="question-box">
        <div class="category-tag" id="categoryTag">Astronomía</div>
        <div class="question-title" id="questionTitle">¿Cuál de estos NO es un planeta principal del Sistema Solar?</div>
      </div>

      <div class="cards-grid" id="cardsGrid">
        <!-- Las 4 tarjetas se insertan dinámicamente -->
      </div>

      <div class="explanation-modal" id="explanationModal">
        <div class="explanation-title" id="explanationTitle">¡Correcto! 🎉</div>
        <div class="explanation-text" id="explanationText">Plutón es un planeta enano desde el año 2006.</div>
        <button class="btn-next" id="btnNext" onclick="nextLevel()">Siguiente Nivel 🚀</button>
      </div>
    </main>
  </div>

  <div class="end-modal" id="endModal">
    <div class="end-card">
      <h2>🏆 ¡DESAFÍO COMPLETADO!</h2>
      <p id="endRank">¡Eres un Detective Galáctico de Nivel Leyenda!</p>
      <div class="score-summary">
        Puntuación Final: <span id="finalScore" style="color:var(--accent-cyan)">0</span> pts
      </div>
      <button class="btn-next" onclick="restartGame()">Jugar de Nuevo 🔄</button>
    </div>
  </div>

  <script>
    // System Stars Canvas Background
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const numStars = Math.floor((canvas.width * canvas.height) / 3000);
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
        ctx.fill();
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
      });
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();

    // Web Audio API Synthesizer Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); // A5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // Dataset completo de los 15 niveles
    const levels = [
      {
        category: "Astronomía",
        question: "¿Cuál de estos NO es considerado un planeta principal del Sistema Solar?",

        options: [
          { name: "Tierra", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#3b82f6"/><path d="M25 45 Q 35 30 55 35 T 75 55 Q 60 70 40 65 Z" fill="#22c55e"/><path d="M40 70 Q 55 85 70 75 Q 60 90 40 85 Z" fill="#22c55e"/></svg>` },
          { name: "Júpiter", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#d97706"/><rect x="10" y="35" width="80" height="8" fill="#b45309" rx="4"/><rect x="8" y="55" width="84" height="10" fill="#78350f" rx="5"/><circle cx="65" cy="60" r="7" fill="#ef4444"/></svg>` },
          { name: "Marte", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="#ef4444"/><circle cx="35" cy="35" r="8" fill="#dc2626"/><circle cx="65" cy="55" r="12" fill="#b91c1c"/></svg>` },
          { name: "Plutón", isImpostor: true, svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="32" fill="#9ca3af"/><path d="M42 45 Q 50 35 58 45 Q 62 55 50 65 Q 38 55 42 45 Z" fill="#f3f4f6"/></svg>` }
        ]
      },
      {
        category: "Astronomía",
        question: "3 son galaxias compuestas por miles de millones de estrellas. ¿Cuál es la impostora?",
        explanation: "¡La Nebulosa de Orión es la impostora! Es una gigantesca nube de gas y polvo donde nacen estrellas, no una galaxia entera.",
        options: [
          { name: "Vía Láctea", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="42" ry="18" fill="none" stroke="#a855f7" stroke-width="6" transform="rotate(-20 50 50)"/><circle cx="50" cy="50" r="10" fill="#fef08a"/></svg>` },
          { name: "Andrómeda", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="45" ry="15" fill="none" stroke="#06b6d4" stroke-width="6" transform="rotate(25 50 50)"/><circle cx="50" cy="50" r="12" fill="#ffffff"/></svg>` },
          { name: "Galaxia Sombrero", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="44" ry="12" fill="#38bdf8"/><circle cx="50" cy="46" r="14" fill="#fef08a"/><line x1="8" y1="50" x2="92" y2="50" stroke="#1e293b" stroke-width="3"/></svg>` },
          { name: "Nebulosa Orión", isImpostor: true, svg: `<svg viewBox="0 0 100 100"><path d="M30 30 Q 50 10 70 30 Q 90 50 70 70 Q 50 90 30 70 Q 10 50 30 30 Z" fill="#ec4899" opacity="0.8"/><circle cx="50" cy="50" r="6" fill="#fff"/></svg>` }
        ]
      },
      {
        category: "Astronomía",
        question: "3 emiten su propia luz por fusión nuclear. ¿Cuál es la impostora?",

          { name: "Sirio", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><path d="M50 15 L58 42 L85 50 L58 58 L50 85 L42 58 L15 50 L42 42 Z" fill="#38bdf8"/></svg>` },
          { name: "Betelgeuse", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><path d="M50 12 L59 40 L88 50 L59 60 L50 88 L41 60 L12 50 L41 40 Z" fill="#ef4444"/></svg>` },
          { name: "La Luna", isImpostor: true, svg: `<svg viewBox="0 0 100 100"><path d="M50 15 A 35 35 0 1 0 85 50 A 28 28 0 1 1 50 15 Z" fill="#cbd5e1"/></svg>` }
        ]
      },
      {
        category: "Astronomía",
        question: "3 se usan para observar astros en el espacio. ¿Cuál es el impostor?",
        explanation: "¡El Microscopio es el impostor! Se utiliza para ver objetos diminutos como células o bacterias en biología, no en astronomía.",
        options: [
          { name: "Telescopio James Webb", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><polygon points="50,20 65,30 65,50 50,60 35,50 35,30" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><rect x="42" y="62" width="16" height="25" fill="#94a3b8"/></svg>` },
          { name: "Telescopio Hubble", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><rect x="35" y="20" width="30" height="50" rx="5" fill="#cbd5e1" transform="rotate(-15 50 45)"/><rect x="15" y="40" width="70" height="10" fill="#0284c7" transform="rotate(-15 50 45)"/></svg>` },
          { name: "Radiotelescopio ALMA", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><path d="M20 50 Q 50 20 80 50 Z" fill="#e2e8f0"/><line x1="50" y1="50" x2="50" y2="75" stroke="#64748b" stroke-width="6"/><rect x="35" y="75" width="30" height="8" fill="#475569"/></svg>` },
          { name: "Microscopio", isImpostor: true, svg: `<svg viewBox="0 0 100 100"><path d="M60 20 L40 40 M35 35 L45 25 M30 75 L70 75 M50 45 L50 75 M40 55 C 20 55 20 75 40 75" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round"/></svg>` }
        ]
      },
      {
        category: "Astronomía",
        question: "3 son patrones de estrellas visibles en el cielo nocturno. ¿Cuál es el impostor?",
        explanation: "¡El Agujero Negro es el impostor! Es una región con una gravedad tan intensa que nada puede escapar de ella, no una agrupación de estrellas.",
        options: [
          { name: "Orión", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><circle cx="30" cy="25" r="4" fill="#fff"/><circle cx="70" cy="25" r="4" fill="#fff"/><circle cx="40" cy="50" r="3" fill="#38bdf8"/><circle cx="50" cy="50" r="3" fill="#38bdf8"/><circle cx="60" cy="50" r="3" fill="#38bdf8"/><circle cx="35" cy="80" r="4" fill="#fff"/><circle cx="65" cy="80" r="4" fill="#fff"/><line x1="30" y1="25" x2="70" y2="25" stroke="rgba(255,255,255,0.3)"/><line x1="40" y1="50" x2="60" y2="50" stroke="rgba(255,255,255,0.3)"/></svg>` },
          { name: "Osa Mayor", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><path d="M15 30 L30 35 L42 48 L55 52 L58 75 L82 72 L78 50 Z" fill="none" stroke="#38bdf8" stroke-width="2"/><circle cx="15" cy="30" r="4" fill="#fff"/><circle cx="30" cy="35" r="4" fill="#fff"/><circle cx="42" cy="48" r="4" fill="#fff"/><circle cx="55" cy="52" r="4" fill="#fff"/><circle cx="78" cy="50" r="4" fill="#fff"/><circle cx="82" cy="72" r="4" fill="#fff"/><circle cx="58" cy="75" r="4" fill="#fff"/></svg>` },
          { name: "Cassiopeia", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><path d="M15 60 L32 30 L50 55 L70 25 L88 45" fill="none" stroke="#ec4899" stroke-width="3"/><circle cx="15" cy="60" r="4" fill="#fff"/><circle cx="32" cy="30" r="4" fill="#fff"/><circle cx="50" cy="55" r="4" fill="#fff"/><circle cx="70" cy="25" r="4" fill="#fff"/><circle cx="88" cy="45" r="4" fill="#fff"/></svg>` },

      },
      {

          { name: "Cometa Halley", isImpostor: false, svg: `<svg viewBox="0 0 100 100"><path d="M30 65 L85 15 L70 70 Z" fill="#38bdf8" opacity="0.6"/><circle cx="30" cy="65" r="12" fill="#e2e8f0"/></svg>` },

    let currentLevel = 0;
    let score = 0;
    let streak = 0;
    let maxStreak = 0;
    let answered = false;

    // Función para mezclar arreglos al azar (Algoritmo Fisher-Yates)
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function loadLevel() {
      answered = false;
      const level = levels[currentLevel];

      // Actualizar encabezados y progreso
      document.getElementById('levelText').innerText = `${currentLevel + 1} / ${levels.length}`;
      document.getElementById('scoreText').innerText = score;
      document.getElementById('streakText').innerText = `🔥 ${streak}`;
      document.getElementById('categoryTag').innerText = level.category;
      document.getElementById('questionTitle').innerText = level.question;
      
      const progressPercent = ((currentLevel) / levels.length) * 100;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      // Ocultar modal de explicación
      document.getElementById('explanationModal').style.display = 'none';

      // Mezclar las opciones para que el impostor aparezca en posiciones distintas
      const shuffledOptions = shuffleArray(level.options);

      // Renderizar tarjetas
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      shuffledOptions.forEach((opt) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-svg-wrapper">${opt.svg}</div>
          <div class="card-title">${opt.name}</div>
        `;
        card.onclick = () => handleSelect(card, opt.isImpostor);
        grid.appendChild(card);
      });
    }

    function handleSelect(selectedCard, isImpostor) {
      if (answered) return;
      answered = true;

      const allCards = document.querySelectorAll('.card');
      allCards.forEach(c => c.classList.add('disabled'));

      const expModal = document.getElementById('explanationModal');
      const expTitle = document.getElementById('explanationTitle');
      const expText = document.getElementById('explanationText');

      if (isImpostor) {
        selectedCard.classList.add('correct');
        playSound('correct');
        streak++;
        if (streak > maxStreak) maxStreak = streak;
        const pts = 100 + (streak * 20);
        score += pts;
        
        expTitle.innerText = `¡CORRECTO! 🎯 (+${pts} pts)`;
        expTitle.style.color = "var(--correct-color)";
      } else {
        selectedCard.classList.add('wrong');
        playSound('wrong');
        streak = 0;
        
        // Destacar la respuesta correcta (impostor)
        const level = levels[currentLevel];
        allCards.forEach(c => {
          const title = c.querySelector('.card-title').innerText;
          const isTargetImpostor = level.options.find(o => o.name === title)?.isImpostor;
          if (isTargetImpostor) c.classList.add('correct');
        });

        expTitle.innerText = "¡OH NO! ESE NO ERA EL IMPOSTOR ❌";
        expTitle.style.color = "var(--wrong-color)";
      }

      expText.innerText = levels[currentLevel].explanation;
      expModal.style.display = 'flex';
      
      document.getElementById('scoreText').innerText = score;
      document.getElementById('streakText').innerText = `🔥 ${streak}`;
    }

    function nextLevel() {
      currentLevel++;
      if (currentLevel < levels.length) {
        loadLevel();
      } else {
        showEndGame();
      }
    }

    function showEndGame() {
      document.getElementById('progressBar').style.width = `100%`;
      const endModal = document.getElementById('endModal');
      document.getElementById('finalScore').innerText = score;

      let rank = "¡Excelente Trabajo, Detective!";
      if (score >= 1800) rank = "🏆 ¡SUPER DETECTIVE GALÁCTICO SUPREMO!";
      else if (score >= 1200) rank = "🚀 ¡EXPLORADOR ESPACIAL EXPERTO!";

      document.getElementById('endRank').innerText = `${rank}\nTu mejor racha fue de ${maxStreak} aciertos seguidos.`;
      endModal.style.display = 'flex';
    }

    function restartGame() {
      currentLevel = 0;
      score = 0;
      streak = 0;
      maxStreak = 0;
      document.getElementById('endModal').style.display = 'none';
      loadLevel();
    }

    // Iniciar juego al cargar
    loadLevel();
